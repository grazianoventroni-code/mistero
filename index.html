<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#d8cfb0;font-family:"Courier New",Courier,monospace;overscroll-behavior:none}
#screen{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--sw);
  padding:0 min(env(safe-area-inset-right),10px) 0 0;
  --ph:clamp(46px,12.5vh,58px);--sl:clamp(32px,10vh,44px);--sw:calc(var(--sl) + 14px);background:#000}
@supports (height:1dvh){#screen{--ph:clamp(46px,12.5dvh,58px);--sl:clamp(32px,10dvh,44px)}}
#stage{display:grid;grid-template-rows:minmax(0,1fr) var(--ph);row-gap:2px;min-width:0;min-height:0}
#wrap{position:relative;background:#000;min-width:0;min-height:0;overflow:hidden}
#side{min-height:0;width:var(--sw);display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 4px 6px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:3%;text-align:center;pointer-events:none;visibility:hidden;font-family:Verdana,'Trebuchet MS','DejaVu Sans',Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(10px,3vh,14px);color:#b8bccb;text-shadow:0 0 4px #000,0 1px 0 #000}
#ver{position:absolute;left:6px;bottom:2px;font:10px Verdana,sans-serif;color:#5a6070;pointer-events:none;opacity:.7}
#crt{position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.13) 3px),
 radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.5) 100%)}
#menu{position:absolute;left:0;right:0;bottom:12%;display:none;flex-direction:column;align-items:center;gap:8px}
button{font-family:Verdana,'Trebuchet MS','DejaVu Sans',Arial,sans-serif;font-weight:800;color:#d8cfb0;background:rgba(10,13,20,.88);border:2px solid #4a5a70;padding:8px 18px;font-size:clamp(12px,3.6vh,16px);letter-spacing:2px;text-transform:uppercase;border-radius:0;box-shadow:3px 3px 0 #000}
button:active{background:#1a2438;transform:translate(1px,1px)}
#dlg{height:var(--ph);width:100%;padding:4px 10px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:rgba(6,8,13,.9);border:2px solid #4a5a70;box-shadow:inset 0 0 0 1px #05070c;
  opacity:0;transition:opacity .5s;pointer-events:none}
#dlg.on{opacity:1}
#txt{margin:0;font-family:Verdana,'Trebuchet MS','DejaVu Sans',Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em;text-align:center;font-size:clamp(11px,3.5vh,16px);line-height:1.25;color:#e8dfc0}
#bar{display:flex;flex-direction:column;gap:6px}
#inv{display:none;grid-auto-flow:row;gap:4px;padding:4px;background:rgba(6,8,13,.82);border:2px solid #4a5a70;box-shadow:3px 3px 0 rgba(0,0,0,.5);touch-action:none}
#inv .slot{position:relative;width:var(--sl);height:var(--sl);background:#10141c;border:2px solid #2e3a4c;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
#inv .slot canvas{width:90%;height:90%;image-rendering:pixelated;pointer-events:none}
#inv .slot.tgt{border-color:#d99a45;animation:pl .5s steps(2) infinite}
#inv .slot b{position:absolute;right:2px;bottom:0;font-size:11px;color:#d8cfb0;text-shadow:1px 1px #000;pointer-events:none}
@keyframes pl{50%{background:#2a2014}}
#bar button{padding:2px 0;width:var(--sl);height:calc(var(--sl)*.8);font-size:clamp(13px,4vh,18px);letter-spacing:0;opacity:.8}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#05070c;color:#d8cfb0;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;font-size:16px;letter-spacing:1px}
#rot i{display:block;width:44px;height:74px;border:4px solid #d99a45;box-shadow:3px 3px 0 #000;animation:rt 2.2s steps(1) infinite}
@keyframes rt{0%,45%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
</style>
</head>
<body>
<div id="screen">
  <div id="stage">
    <div id="wrap">
      <canvas id="c"></canvas>

    <div id="bar"><button id="bHint">?</button><button id="bSnd">♪</button></div>

  </div>
</div>
<div id="probe" style="position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<div id="rot"><i></i><div>RUOTA IL TELEFONO<br>IN ORIZZONTALE</div></div>

<script>
(()=>{
"use strict";
const W=240,H=120;
const cv=document.getElementById('c'),dctx=cv.getContext('2d');
const scn=document.createElement('canvas');scn.width=W;scn.height=H;const g=scn.getContext('2d');g.imageSmoothingEnabled=false;
/* La scena è disegnata in 240x120. Lo schermo visibile è più largo (tutto lo spazio libero in orizzontale):
   i margini laterali sono riempiti con la continuazione speculare dei bordi, scurita come una vignetta. */
let DW=W,OX=0;
function resizeDisplay(){
  const wr=document.getElementById('wrap').getBoundingClientRect();
  const aspect=wr.height>0?wr.width/wr.height:2;
  DW=Math.max(W,Math.min(380,Math.round(H*aspect/2)*2));OX=(DW-W)/2;
  cv.width=DW;cv.height=H;dctx.imageSmoothingEnabled=false}
const ec=document.createElement('canvas');ec.width=2;ec.height=H;const ecx=ec.getContext('2d');
function present(){
  dctx.fillStyle='#000';dctx.fillRect(0,0,DW,H);
  if(OX>0){
    /* margini: media di 12 colonne di bordo (niente righe isolate), poi allargata */
    ecx.imageSmoothingEnabled=true;ecx.clearRect(0,0,2,H);ecx.drawImage(scn,0,0,12,H,0,0,1,H);ecx.drawImage(scn,W-12,0,12,H,1,0,1,H);ecx.imageSmoothingEnabled=false;
    dctx.imageSmoothingEnabled=false;dctx.drawImage(ec,0,0,1,H,0,0,OX,H);dctx.drawImage(ec,1,0,1,H,DW-OX,0,OX,H);
    const gl=dctx.createLinearGradient(0,0,OX,0);gl.addColorStop(0,'rgba(0,0,0,.9)');gl.addColorStop(1,'rgba(0,0,0,.45)');
    dctx.fillStyle=gl;dctx.fillRect(0,0,OX,H);
    const gr=dctx.createLinearGradient(DW-OX,0,DW,0);gr.addColorStop(0,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,.9)');
    dctx.fillStyle=gr;dctx.fillRect(DW-OX,0,OX,H)}
  dctx.drawImage(scn,OX,0)}
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lg=lc.getContext('2d');

/* ================= utilità ================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex2=c=>Array.isArray(c)?c:[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mx=(a,b,k)=>{const A=hex2(a),B=hex2(b);k=clamp(k,0,1);return [A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k]};
const rgb=a=>'rgb('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+')';
const mix=(a,b,k)=>rgb(mx(a,b,k));

function R(x,y,w,h,c,k=g){k.fillStyle=c;const x0=Math.round(x),y0=Math.round(y);const w2=Math.round(x+w)-x0,h2=Math.round(y+h)-y0;if(w2>0&&h2>0)k.fillRect(x0,y0,w2,h2)}
function disc(x,y,r,c,a=1,k=g){k.globalAlpha=a;k.fillStyle=c;for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy+.5));k.fillRect(Math.round(x)-dx,Math.round(y)+dy,2*dx+1,1)}k.globalAlpha=1}
function ell(x,y,rx,ry,c,a=1,k=g){k.globalAlpha=a;k.fillStyle=c;for(let dy=-ry;dy<=ry;dy++){const dx=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));k.fillRect(Math.round(x)-dx,Math.round(y)+dy,2*dx+1,1)}k.globalAlpha=1}
function line(x0,y0,x1,y1,c,th=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;g.fillStyle=c;for(let i=0;i<500;i++){g.fillRect(x0,y0,th,th);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

/* font 3x5 per le scritte nella scena */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','.':'000000000000010','-':'000000111000000','!':'010010010000010','?':'110001010000010',' ':'000000000000000'};
function txt(s,x,y,c,sc=1){for(let i=0;i<s.length;i++){const gl=FONT[s[i]]||FONT[' '];for(let j=0;j<15;j++)if(gl[j]==='1')R(x+(i*4+(j%3))*sc,y+Math.floor(j/3)*sc,sc,sc,c)}}
const txtW=(s,sc=1)=>s.length*4*sc-sc;

/* ================= audio ================= */
const AU={ctx:null,muted:false};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();loadAudioFiles();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  const n=c.sampleRate*2,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.buf=buf;
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.9;AU.master.connect(c.destination);
  const loopNoise=()=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;return s};
  const rs=loopNoise(),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
  AU.rainLP=c.createBiquadFilter();AU.rainLP.type='lowpass';AU.rainLP.frequency.value=7000;
  AU.rainG=c.createGain();AU.rainG.gain.value=0;
  rs.connect(hp);hp.connect(AU.rainLP);AU.rainLP.connect(AU.rainG);AU.rainG.connect(AU.master);rs.start();
  const o=c.createOscillator();o.type='sawtooth';o.frequency.value=45;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;
  AU.engG=c.createGain();AU.engG.gain.value=0;AU.engO=o;
  o.connect(lp);lp.connect(AU.engG);AU.engG.connect(AU.master);o.start();
  const fs=loopNoise(),fb=c.createBiquadFilter();fb.type='bandpass';fb.frequency.value=700;fb.Q.value=.5;
  AU.fireG=c.createGain();AU.fireG.gain.value=0;fs.connect(fb);fb.connect(AU.fireG);AU.fireG.connect(AU.master);fs.start();
  loadAudioFiles();
}
/* temporale e tuoni dai file della cartella `suoni` (audio/temporale.wav in loop (da suoni/temporale: mono 22 kHz, giunzione del loop sfumata), audio/tuoni.mp3); se non si caricano resta il suono sintetico */
function loadAudioFiles(){
  const c=AU.ctx;if(!c||AU.filesReq)return;AU.filesReq=true;
  const get=(u,fn)=>fetch(u).then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,ko)=>c.decodeAudioData(ab,ok,ko))).then(fn).catch(()=>{});
  get('audio/temporale.wav',b=>{
    const s=c.createBufferSource();s.buffer=b;s.loop=true;
    AU.rainFLP=c.createBiquadFilter();AU.rainFLP.type='lowpass';AU.rainFLP.frequency.value=9000;
    AU.rainFG=c.createGain();AU.rainFG.gain.value=0;
    s.connect(AU.rainFLP);AU.rainFLP.connect(AU.rainFG);AU.rainFG.connect(AU.master);s.start(0,Math.random()*30);
    AU.rainFReady=true;setRain(AU.rl||0,!!AU.rind)});
  get('audio/tuoni.mp3',b=>{AU.thBuf=b})}
function setRain(l,ind){if(!AU.ctx)return;AU.rl=l;AU.rind=ind;const t=AU.ctx.currentTime;
  AU.rainG.gain.setTargetAtTime(AU.rainFReady?0:l*(ind?.12:.3),t,.4);AU.rainLP.frequency.setTargetAtTime(ind?650:7000,t,.3);
  if(AU.rainFReady){AU.rainFG.gain.setTargetAtTime(l*(ind?.6:1.7),t,.4);AU.rainFLP.frequency.setTargetAtTime(ind?850:9000,t,.3)}}
function setEng(v,on){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.engG.gain.setTargetAtTime(on?.04+.03*v:0,t,.3);AU.engO.frequency.setTargetAtTime(36+v*30,t,.3)}
function setFire(k){if(!AU.ctx)return;AU.fireG.gain.setTargetAtTime(k*(.015+.05*Math.random()),AU.ctx.currentTime,.05)}
const TH_SEG=[[.15,6.6],[10.5,17.2],[24.1,34.6]];let thLast=-1;
function thunder(v=1){
  if(!AU.ctx)return;
  if(AU.thBuf){const c=AU.ctx;let i;do{i=Math.floor(Math.random()*TH_SEG.length)}while(i===thLast&&TH_SEG.length>1);thLast=i;
    const [a,b]=TH_SEG[i],t=c.currentTime+.02,s=c.createBufferSource();s.buffer=AU.thBuf;
    const g2=c.createGain(),vol=Math.min(1.3,.45+.25*v);g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol,t+.04);g2.gain.setValueAtTime(vol,t+(b-a)-1.2);g2.gain.linearRampToValueAtTime(0,t+(b-a));
    s.connect(g2);g2.connect(AU.master);s.start(t,a,b-a);return}
  thunderSynth(v)}
function thunderSynth(v=1){if(!AU.ctx)return;const c=AU.ctx,t0=c.currentTime+.02;
  if(!AU.rev){const len=Math.floor(c.sampleRate*7),ib=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp+=((Math.random()*2-1)-lp)*(.1+.45*(1-i/len));d[i]=lp*Math.pow(1-i/len,1.7)*3.2}}
    AU.rev=c.createConvolver();AU.rev.buffer=ib;AU.revG=c.createGain();AU.revG.gain.value=1.3;
    AU.tcomp=c.createDynamicsCompressor();AU.tcomp.threshold.value=-16;AU.tcomp.knee.value=12;AU.tcomp.ratio.value=7;AU.tcomp.attack.value=.004;AU.tcomp.release.value=.5;
    AU.tg=c.createGain();AU.tg.gain.value=.7;AU.tsat=c.createWaveShaper();{const n=2048,cv=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cv[i]=Math.tanh(1.6*x)/Math.tanh(1.6)}AU.tsat.curve=cv}AU.tcomp.connect(AU.tg);AU.tg.connect(AU.tsat);AU.tsat.connect(AU.master);AU.rev.connect(AU.revG);AU.revG.connect(AU.tcomp);
    // eco: ripetizioni scure e lontane (come contro le pareti della valle)
    AU.techo=c.createGain();const dl=c.createDelay(1.5);dl.delayTime.value=.47;const fb=c.createGain();fb.gain.value=.5;const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=750;
    AU.techo.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);const eo=c.createGain();eo.gain.value=.75;dlp.connect(eo);eo.connect(AU.tcomp);eo.connect(AU.rev)}
  const out=c.createGain();out.gain.value=v;out.connect(AU.tcomp);
  const send=c.createGain();send.gain.value=1.1;out.connect(send);send.connect(AU.rev);
  const es=c.createGain();es.gain.value=.8;out.connect(es);es.connect(AU.techo);
  const pan=p=>{if(!c.createStereoPanner)return null;const n=c.createStereoPanner();n.pan.value=p;n.connect(out);return n};
  // tr: frequenza (Hz) della vibrazione/ruvidita' del suono, 0 = nessuna
  const burst=(t,dur,f0,f1,amp,type,q,att,tr)=>{const s2=c.createBufferSource();s2.buffer=AU.buf;const f=c.createBiquadFilter();f.type=type;f.Q.value=q||.7;
    f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(28,f1),t+dur);
    const gn=c.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(amp,t+(att===undefined?Math.min(.12,dur*.2):att));gn.gain.exponentialRampToValueAtTime(.0008,t+dur);
    s2.connect(f);f.connect(gn);let last=gn;
    if(tr){const am=c.createGain();am.gain.value=.62;const lf=c.createOscillator(),lg=c.createGain();lf.frequency.value=tr;lg.gain.value=.38;lf.connect(lg);lg.connect(am.gain);lf.start(t);lf.stop(t+dur+.1);gn.connect(am);last=am}
    const pn=pan((Math.random()*2-1)*.8);last.connect(pn||out);s2.start(t,Math.random()*1.2);s2.stop(t+dur+.05)};
  // 1. lo schianto: secchissimo e a banda larga, con il crepitio della scarica
  {const e=c.createOscillator(),eg=c.createGain();e.type='sine';e.frequency.setValueAtTime(110,t0);e.frequency.exponentialRampToValueAtTime(34,t0+.35);eg.gain.setValueAtTime(0,t0);eg.gain.linearRampToValueAtTime(2,t0+.004);eg.gain.exponentialRampToValueAtTime(.001,t0+.5);e.connect(eg);eg.connect(out);e.start(t0);e.stop(t0+.55)}   // colpo d'esplosione
  burst(t0,.6,9000,450,1.5,'lowpass',.5,.002);burst(t0,.09,7000,2500,1.0,'highpass',.5,.001);
  // il "craaaack": il cielo che si strappa, un lungo crepitio ruvido e nitido che scende di tono
  burst(t0,1.7,6500,700,1.6,'bandpass',.8,.003,85);burst(t0+.02,1.3,3800,900,1.2,'bandpass',1.1,.004,55);burst(t0+.03,.9,9000,2600,.8,'highpass',.6,.003,120);
  for(let k=0;k<22;k++){const tk=t0+.03+Math.pow(Math.random(),1.5)*1.5;burst(tk,.06+Math.random()*.13,1800+Math.random()*4200,600,.7*(1-k/30),'bandpass',1.4,.002)}
  // 2. il boato: massa grave e vibrante che crolla; sotto, una botta sinusoidale con vibrato
  burst(t0+.03,3.2,560,50,1.7,'lowpass',.9,.03,21);
  const o=c.createOscillator(),og=c.createGain(),vl=c.createOscillator(),vg=c.createGain();o.type='sine';o.frequency.setValueAtTime(76,t0+.04);o.frequency.exponentialRampToValueAtTime(26,t0+3.8);
  vl.frequency.value=7;vg.gain.value=4;vl.connect(vg);vg.connect(o.frequency);
  og.gain.setValueAtTime(0,t0+.04);og.gain.linearRampToValueAtTime(1.2,t0+.2);og.gain.exponentialRampToValueAtTime(.001,t0+4.2);o.connect(og);og.connect(out);o.start(t0+.04);o.stop(t0+4.3);vl.start(t0+.04);vl.stop(t0+4.3);
  // 3. il rimbombo che rotola per la valle: colpi gravi, ruvidi, sempre piu' lontani
  let tt=t0+.4;for(let k=0;k<15;k++){const fall=Math.pow(1-k/15,1.05),dur=1.1+Math.random()*1.6;
    burst(tt,dur,380+Math.random()*180,36,(.7+.5*Math.random())*fall*1.4,'lowpass',1.2,undefined,12+Math.random()*16);tt+=.2+Math.random()*.6}}
function nburst(freq,q,dur,vol,type='bandpass'){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=AU.buf;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const gn=c.createGain();
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(AU.master);s.start(t);s.stop(t+dur+.05)}
function tone(f,d,type,vol,fTo){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(fTo)o.frequency.exponentialRampToValueAtTime(fTo,t+d);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AU.master);o.start(t);o.stop(t+d+.02)}
const sfx={
  thud(){nburst(160,1,.25,.7,'lowpass');tone(90,.2,'sine',.25,50)},
  scratch(){nburst(3500,2,.45,.35,'highpass')},
  whoosh(){nburst(1200,1,.5,.3)},
  door(){tone(120,.7,'sawtooth',.05,70);nburst(300,1,.3,.2,'lowpass')},
  blip(){tone(520+Math.random()*80,.03,'square',.012)},
  plic(){tone(1400,.06,'sine',.015,900)},
  no(){tone(160,.12,'square',.03,110)},
  take(){tone(660,.08,'triangle',.05,990);setTimeout(()=>tone(990,.12,'triangle',.04),90)}
};

/* ================= colonna sonora (sintetizzata) ================= */
const MU={name:null,bus:null,timer:null,step:0,next:0,sd:.2,ir:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function makeBus(){
  const c=AU.ctx;
  if(!MU.ir){const len=Math.floor(c.sampleRate*2.8),b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}MU.ir=b}
  const out=c.createGain();out.gain.value=0;out.connect(AU.master);
  const dry=c.createGain();dry.connect(out);
  const dl=c.createDelay(1.5);dl.delayTime.value=.66;const fb=c.createGain();fb.gain.value=.4;
  const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=1900;
  const send=c.createGain();send.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);const dg=c.createGain();dg.gain.value=.7;dlp.connect(dg);dg.connect(out);
  const cv2=c.createConvolver();cv2.buffer=MU.ir;const rsend=c.createGain();rsend.connect(cv2);const rg=c.createGain();rg.gain.value=.7;cv2.connect(rg);rg.connect(out);
  return {out,dry,send,rsend};
}
function note(o){
  const c=AU.ctx,b=MU.bus,t=o.t,rel=o.rel||.15;
  const g2=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;
  const cut=o.cut||1500;f.frequency.setValueAtTime(o.sweep?cut*o.sweep:cut,t);if(o.sweep)f.frequency.exponentialRampToValueAtTime(cut,t+(o.sweepT||.3));
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(o.vol,t+(o.att||.01));g2.gain.setValueAtTime(o.vol,t+o.dur);g2.gain.linearRampToValueAtTime(.0001,t+o.dur+rel);
  const end=t+o.dur+rel+.05;
  for(const d of (o.det||[0])){const os=c.createOscillator();os.type=o.type||'sawtooth';os.frequency.value=o.f;os.detune.value=d;
    if(o.vib){const l=c.createOscillator();l.frequency.value=5.2;const lg2=c.createGain();lg2.gain.value=o.vib;l.connect(lg2);lg2.connect(os.detune);l.start(t);l.stop(end)}
    os.connect(f);os.start(t);os.stop(end)}
  f.connect(g2);g2.connect(b.dry);
  if(o.send){const s=c.createGain();s.gain.value=o.send;g2.connect(s);s.connect(b.send)}
  if(o.rev){const s=c.createGain();s.gain.value=o.rev;g2.connect(s);s.connect(b.rsend)}
}
function mKick(t,v=.5){const c=AU.ctx,o=c.createOscillator(),g2=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.14);
  g2.gain.setValueAtTime(v,t);g2.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g2);g2.connect(MU.bus.dry);o.start(t);o.stop(t+.32)}
function mNoise(t,freq,q,dur,vol,type,rev){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.buf;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g2=c.createGain();g2.gain.setValueAtTime(vol,t);g2.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g2);g2.connect(MU.bus.dry);
  if(rev){const r=c.createGain();r.gain.value=rev;g2.connect(r);r.connect(MU.bus.rsend)}s.start(t,Math.random());s.stop(t+dur+.05)}
function mBell(t,m,vol,dur=1.8){const c=AU.ctx,f=mf(m);
  for(const [r,v,d] of [[1,1,dur],[2.76,.35,dur*.35],[5.4,.12,dur*.15]]){const o=c.createOscillator(),g2=c.createGain();o.type='sine';o.frequency.value=f*r;
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol*v,t+.008);g2.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g2);g2.connect(MU.bus.dry);
    const s=c.createGain();s.gain.value=.5;g2.connect(s);s.connect(MU.bus.send);const rv=c.createGain();rv.gain.value=.6;g2.connect(rv);rv.connect(MU.bus.rsend);o.start(t);o.stop(t+d+.05)}}
const D_CH=[[57,60,64],[53,57,60,64],[50,57,62,65],[52,56,59,64]];
const D_BASS=[45,41,38,40];
const D_MEL=[[[0,76,6],[6,72,2],[8,74,2],[10,72,6]],[[0,69,8],[8,72,6]],[[0,74,6],[6,77,2],[8,76,8]],[[0,71,4],[4,68,4],[8,76,8]]];
function schedDrive(step,t){
  const sd=MU.sd,bar=Math.floor(step/16)%4,s=step%16,loop=Math.floor(step/64),ch=D_CH[bar];
  if(s===0){for(const m of ch)note({t,f:mf(m),dur:16*sd-.2,vol:.05,type:'sawtooth',det:[-9,9],cut:900,att:1.2,rel:1.4,send:.2,rev:.35})}
  if(s===0)note({t,f:mf(D_BASS[bar]),dur:6.5*sd,vol:.30,type:'sawtooth',cut:520,q:3,sweep:3,sweepT:.35,rel:.12,det:[0,6]});
  if(s===8)note({t,f:mf(D_BASS[bar]),dur:3.5*sd,vol:.26,type:'sawtooth',cut:480,q:3,sweep:2.5,sweepT:.3,rel:.1,det:[0,6]});
  if(s===12&&bar%2===0)note({t,f:mf(D_BASS[bar]+7),dur:1.8*sd,vol:.20,type:'sawtooth',cut:520,q:2,rel:.1});
  if(s===14&&bar===3)note({t,f:mf(D_BASS[bar]+12),dur:1.6*sd,vol:.17,type:'sawtooth',cut:600,rel:.1});
  if(loop>=1){for(const [st,m,len] of D_MEL[bar])if(st===s)note({t,f:mf(m),dur:len*sd-.04,vol:.085,type:'sawtooth',det:[-6,6],cut:2300,att:.06,rel:.35,vib:7,send:.55,rev:.5})}
  if(loop>=2){if(s===0||s===8)mKick(t,.42);if(s===8)mNoise(t,1900,.8,.22,.22,'bandpass',.6);if(s%2===0)mNoise(t,7500,1,.04,.035+(s%4===0?.015:0),'highpass',0)}
}
const M_CH=[[50,57,62,65],[46,53,58,62],[43,50,58,62],[45,52,57,61]];
const M_ROOT=[38,34,31,33];
function schedMystery(step,t){
  const sd=MU.sd,bar=Math.floor(step/16)%4,s=step%16,ch=M_CH[bar];
  if(s===0){
    for(const m of ch)note({t,f:mf(m),dur:16*sd-.3,vol:.045,type:'sawtooth',det:[-10,10],cut:650,att:2.2,rel:2,send:.15,rev:.5});
    note({t,f:mf(M_ROOT[bar]+12),dur:16*sd-.3,vol:.14,type:'triangle',cut:400,att:.6,rel:1.2});
    note({t:t+.5,f:mf(ch[2]+12),dur:5,vol:.03,type:'sawtooth',det:[-14,14],cut:1400,att:3,rel:3,vib:12,rev:.7});
  }
  if(s===0||s===3){const c=AU.ctx,o=c.createOscillator(),g2=c.createGain();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(52,t+.12);
    g2.gain.setValueAtTime(s===0?.28:.16,t);g2.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g2);g2.connect(MU.bus.dry);o.start(t);o.stop(t+.3)}
  if([2,6,7,11,14].includes(s)&&hash(step*1.7+bar)>.28){
    const m=ch[Math.floor(hash(step+3.3)*ch.length)]+12+(hash(step*.7)>.6?12:0);mBell(t,m,.07+hash(step+1)*.03)}
}

/* colonna sonora del sogno: lenta, irrisolta, senza ritmo; il battito del cuore e' separato (sogno.heart) */
const S_PAD=[[50,57,63],[49,56,61],[46,53,60],[48,55,62]];
const S_BELL=[[0,86],[3,83],[6,79],[9,84],[12,77]];
function schedDream(step,t){
  const sd=MU.sd,bar=Math.floor(step/16)%4,s=step%16,ch=S_PAD[bar];
  if(s===0){
    for(const m of ch)note({t,f:mf(m),dur:16*sd-.2,vol:.04,type:'sawtooth',det:[-14,14],cut:520,att:3,rel:3,send:.2,rev:.6});
    note({t,f:mf(ch[0]-12),dur:16*sd,vol:.16,type:'sine',att:2,rel:2.5,cut:300});
    note({t:t+1.2,f:mf(ch[1]+24),dur:7,vol:.014,type:'sine',att:4,rel:4,vib:18,rev:.8});          // sibilo acuto, quasi un respiro
  }
  for(const [st,m] of S_BELL){if(st===s&&hash(step*2.3+bar*5)>.2)mBell(t,m+(bar%2?-1:0),.05+hash(step)*.025,4.5)}      // carillon lontano, non allineato alla tonalita'
  if(s===8&&bar%2===1)note({t,f:mf(ch[2]+12),dur:5,vol:.03,type:'triangle',det:[-22,22],att:2.4,rel:2.6,cut:900,vib:10,rev:.8});
}
const THEMES={drive:{bpm:72,fn:schedDrive,vol:.6},mystery:{bpm:58,fn:schedMystery,vol:.7},sogno:{bpm:42,fn:schedDream,vol:.75}};
function musicStop(fade=2){
  if(!MU.name)return;const old=MU.bus,c=AU.ctx;clearInterval(MU.timer);MU.name=null;
  if(old&&c){old.out.gain.setTargetAtTime(0,c.currentTime,fade/3);setTimeout(()=>{try{old.out.disconnect()}catch(e){}},fade*1000+4500)}
}
function musicStart(name,fade=4){
  if(!AU.ctx||MU.name===name)return;
  musicStop(1.2);
  const th=THEMES[name],c=AU.ctx;MU.name=name;MU.bus=makeBus();MU.step=0;MU.sd=60/th.bpm/4;MU.next=c.currentTime+.2;
  MU.bus.out.gain.setTargetAtTime(th.vol,c.currentTime,fade/3);
  const tick=()=>{if(MU.name!==name)return;while(MU.next<c.currentTime+.6){th.fn(MU.step,MU.next);MU.next+=MU.sd;MU.step++}};
  tick();MU.timer=setInterval(tick,150);
}

const txtEl=document.getElementById('txt'),dlgEl=document.getElementById('dlg');
let full='',pos=0,typer=null,hideT=null,qrest=[];
/* divide le frasi lunghe in parti da leggere una dopo l'altra (taglio vicino alla meta', preferibilmente a fine frase) */
function splitText(s,max=88){
  s=s.trim();if(s.length<=max)return [s];
  const mid=s.length/2;let best=-1,bd=1e9;
  for(let i=8;i<s.length-8;i++){const c=s[i];if(s[i+1]===' '&&'.!?:;'.includes(c)){const d=Math.abs(i-mid)-14;if(d<bd){bd=d;best=i}}}
  if(best<0)for(let i=8;i<s.length-8;i++){if(s[i]===' '||s[i]===','){const d=Math.abs(i-mid);if(d<bd){bd=d;best=s[i]===','?i:i-1}}}
  if(best<0)return [s];
  return [...splitText(s.slice(0,best+1),max),...splitText(s.slice(best+1),max)]}
function nextChunk(){
  if(!qrest.length)return;
  full=qrest.shift();pos=0;txtEl.textContent='';dlgEl.classList.add('on');
  typer=setInterval(()=>{pos++;txtEl.textContent=full.slice(0,pos);if(pos%3===0)sfx.blip();if(pos>=full.length){clearInterval(typer);typer=null;afterText()}},24)}
function afterText(){clearTimeout(hideT);
  if(qrest.length)hideT=setTimeout(nextChunk,1200+full.length*62);          // tempo di lettura prima della seconda parte
  else hideT=setTimeout(()=>dlgEl.classList.remove('on'),3500+full.length*55)}
function say(s){clearInterval(typer);clearTimeout(hideT);typer=null;txtEl.textContent='';full='';pos=0;qrest=[];
  if(!s){dlgEl.classList.remove('on');return}
  qrest=splitText(s);nextChunk()}
function finishText(){
  if(typer){clearInterval(typer);typer=null;txtEl.textContent=full;afterText();return}
  if(qrest.length){clearTimeout(hideT);nextChunk()}}

function updateFade(dt){if(fade.a===fade.to)return;const d=Math.sign(fade.to-fade.a)*fade.speed*dt;fade.a+=d;
  if((d>0&&fade.a>=fade.to)||(d<0&&fade.a<=fade.to)){fade.a=fade.to;const cb=fade.cb;fade.cb=null;if(cb)cb()}}

function rainFx(n,y0,y1,speed,a,time){g.globalAlpha=a;g.fillStyle='#8a98ae';const span=y1-y0+12;
  for(let i=0;i<n;i++){const x=hash(i*3.1)*(W+30),ph=hash(i*7.7)*span,y=y0+((ph+time*speed*(.8+hash(i)*.5))%span);
    g.fillRect(Math.round(x-(y-y0)*.1),Math.round(y),1,3)}g.globalAlpha=1}
function bolt(bx,hz,fl,age){if(age<0||age>.2)return;let x=bx;g.globalAlpha=.9;
  for(let y=0;y<hz;y+=4){const nx=x+(hash(bx*3+y)-.5)*9;line(x,y,nx,y+4,'#eef4ff',1);x=nx}g.globalAlpha=1}
function pine(x,by,h,col,col2){const w=h*.34;R(x-Math.max(1,h*.04),by-h*.12,Math.max(2,h*.08),h*.12,'#05070a');
  for(let k=0;k<3;k++){const top=by-h+k*h*.26,th=h*.46,hw=w*(.45+.3*k);
    for(let yy=0;yy<th;yy++){const hw2=hw*(yy/th);R(x-hw2,top+yy,hw2*2+1,1,(yy%3===0)?col2:col)}}}
function sky(h,fl,c1='#05070c',c2='#18202e'){for(let y=0;y<h;y++){R(0,y,W,1,rgb(mx(mx(c1,c2,y/h),'#b4c4e4',fl*(.5+.4*y/h))))}}
function clouds(h,fl,time){g.globalAlpha=.08+fl*.12;for(let j=0;j<7;j++){const y=3+j*(h/8),x=((hash(j)*(W+60)-time*(1.5+j*.6))%(W+60)+(W+60))%(W+60)-40;R(x,y,30+hash(j+9)*60,2,'#8090a8')}g.globalAlpha=1}
function outline(r,c='#d99a45'){const on=Math.floor(NOW*5)%2;g.fillStyle=c;
  for(let x=r.x;x<r.x+r.w;x++){if((x+on)%2===0){g.fillRect(x,r.y,1,1);g.fillRect(x,r.y+r.h-1,1,1)}}
  for(let y=r.y;y<r.y+r.h;y++){if((y+on)%2===0){g.fillRect(r.x,y,1,1);g.fillRect(r.x+r.w-1,y,1,1)}}}
const inR=(r,x,y,p=0)=>x>=r.x-p&&x<=r.x+r.w+p&&y>=r.y-p&&y<=r.y+r.h+p;


/* ===== abeti curati: rami a strati con bordi irregolari, colori che sfumano nella nebbia con la distanza ===== */
function treePal(s,fl){
  s=clamp(s,0,1);const f=(a,b)=>rgb(mx(mx(a,b,s),'#c0d0ec',fl*.28));
  return {d:f('#34464e','#08130f'),m:f('#3e545c','#0e211b'),l:f('#4c646c','#1c3c30'),t:f('#2a3a40','#150f0b'),r:f('#6e8890','#46685a')};
}
function fpine(x,by,h,pal,seed,k=g){
  if(h<5){R(x-1,by-h,3,h,pal.d,k);return}
  const th=Math.max(0,Math.round(h*.03));
  R(x-th,by-h*.2,th*2+1,h*.2,pal.t,k);
  const T=Math.max(3,Math.round(h/5.2));
  for(let i=0;i<T;i++){
    const f=(i+1)/T,ty=by-h+(h*.9)*(i/T),bw=(1.6+f*h*.26)*(.88+.24*hash(seed+i*3.1)),bh=Math.max(3,Math.round(h/T*1.55));
    for(let r=0;r<bh;r++){
      const kk=r/bh,hw=bw*(.16+.84*Math.pow(kk,.85)),jag=(hash(seed*7.7+i*13.1+r*3.3)-.5)*Math.max(1.4,bw*.3);
      const wl=hw+jag,wr=hw-jag*.7,c=kk<.26?pal.l:kk<.72?pal.m:pal.d;
      R(x-wl,ty+r,wl+wr+1,1,c,k);
      if(kk<.26&&wl>2)R(x-wl,ty+r,1,1,pal.r,k);
    }
    R(x-bw-.5,ty+bh-1,2,2,pal.d,k);R(x+bw-1,ty+bh-1,2,2,pal.d,k);
  }
}

const ft=document.createElement('canvas');ft.width=W;ft.height=H;const fx=ft.getContext('2d');
const fm=document.createElement('canvas');fm.width=W;fm.height=H;const fmx=fm.getContext('2d');

const SOGNO_T={walk0:1.0,walkSpeed:38,x0:62,x1:200,fy:108,read:0,sleep:0,black:0,dream0:0,vis:6.4,gap:.9};
SOGNO_T.walkEnd=SOGNO_T.walk0+(SOGNO_T.x1-SOGNO_T.x0)/SOGNO_T.walkSpeed;   // arriva davanti al divano
SOGNO_T.sitEnd=SOGNO_T.walkEnd+.7;
SOGNO_T.readEnd=SOGNO_T.sitEnd+5.5;

/* disegna la figura su ft (fuori scena), poi la illumina con la mappa luce della stanza e la applica */
function figureLit(fn){
  fx.clearRect(0,0,W,H);fn(fx);
  fmx.clearRect(0,0,W,H);fmx.globalCompositeOperation='source-over';fmx.drawImage(ft,0,0);
  fx.globalCompositeOperation='multiply';fx.drawImage(lc,0,0);
  fx.globalCompositeOperation='destination-in';fx.drawImage(fm,0,0);fx.globalCompositeOperation='source-over';
  g.drawImage(ft,0,0)}

/* persona seduta di profilo, composta dai pezzi del fotogramma di profilo (rivolta a sinistra, verso la stanza) */
function drawSeat(c,o){
  const S=IMG_PINT,FW=26,HX=13,HY=31,lean=.2+(o.lean||0);
  c.save();c.translate(Math.round(o.x),Math.round(o.y));c.scale(-1,1);c.translate(-HX,-HY);
  // una gamba: coscia in avanti, tibia (piegata al ginocchio) e scarpa
  const leg=(oy,phi,shin,dark)=>{
    c.save();c.translate(HX,HY+oy);c.rotate(-Math.PI/2+phi);c.drawImage(S,10,31,9,13,-4.5,0,9,13);c.restore();
    const kx=HX+13*Math.cos(phi),ky=HY+oy+13*Math.sin(phi);
    c.save();c.translate(kx,ky);c.rotate(shin);c.drawImage(S,10,44,10,9,-4.5,-1,10,9);
    c.save();c.translate(0,8);c.rotate(-shin*.55);c.drawImage(S,9,53,14,3,-5.5,0,14,3);c.restore();c.restore();
    if(dark){c.globalCompositeOperation='source-atop';c.fillStyle='rgba(0,0,0,.35)';c.fillRect(-20,-20,120,160);c.globalCompositeOperation='source-over'}};
  leg(0,0,0,true);                    // gamba sotto: tibia verticale, piede a terra
  leg(-3,-.2,-.62,false);             // gamba accavallata: ginocchio piu' alto, tibia in avanti e in basso
  // busto reclinato contro lo schienale
  c.save();c.translate(HX,HY);c.rotate(-lean);c.translate(-HX,-HY);
  c.drawImage(S,0,14,FW,11,0,14,FW,11);
  c.drawImage(S,12,25,8,6,12,25,8,6);
  // avambraccio e libro (di profilo)
  const ex=10,ey=24,L=11,th=o.arm,hx=ex-Math.sin(th)*L,hy=ey+Math.cos(th)*L,bk=lerp(-.35,-1.45,o.bookMode);
  c.save();c.translate(hx+1,hy-1);c.rotate(bk);
  c.fillStyle='#1a2f78';c.fillRect(0,-7,3,14);c.fillStyle='#3a5cc0';c.fillRect(0,-7,1,14);c.fillStyle='#0e1a48';c.fillRect(2,-7,1,14);
  c.fillStyle='#d8cdb0';c.fillRect(-1,-6,1,12);c.fillStyle='#b8ac90';c.fillRect(-2,-5,1,10);
  c.fillStyle='#e0b040';c.fillRect(0,-4,3,1);c.fillRect(0,2,3,1);
  c.fillStyle='#c8946e';c.fillRect(-2,1,2,2);c.fillRect(-1,3,2,1);
  c.restore();
  c.save();c.translate(ex,ey);c.rotate(th);c.drawImage(S,8,24,4,11,-2,0,4,11);c.restore();
  c.save();c.translate(14,14+o.dy);c.rotate(o.ang);c.drawImage(S,0,0,FW,14,-14,-14,FW,14);c.restore();
  c.restore();c.restore()}
const sogno={t:0,steps:0,lastStep:0,vis:-1,
  enter(){this.t=0;this.steps=0;this.vis=-1;this.zz=0;this.quiet=false;this.done=false;document.getElementById('bHint').style.display='none';say('');
    stormReset(2);setRain(.8,true);inside.idle=0;inside.hintUntil=0},
  update(dt){this.t+=dt;const t=this.t,T=SOGNO_T;
    if(t<T.sleepEnd-1.6)updateStorm();else{stormTimers.forEach(clearTimeout);stormTimers=[];storm.next=1e12}   // niente tuoni durante il sogno
    inside.idle=0;
    if(S.stove.lit&&NOW-S.stove.litAt>3.5&&MU.name!=='mystery'&&t<T.sleepEnd-1.7)musicStart('mystery',6);
    if(S.stove.lit&&t<T.sleepEnd-.8)setFire(sm((NOW-S.stove.litAt)/4));
    const ph=Math.floor(NOW/.9);if(ph!==this.ph){this.ph=ph;if(Math.random()<.9&&t<T.sleepEnd-1.6)setTimeout(sfx.plic,260)}
    if(t>T.sleepEnd-.8&&!this.quiet){this.quiet=true;setRain(0,true);setFire(0);setEng(0,false)}   // restano solo la musica e il battito
    // passi
    if(t>T.walk0&&t<T.walkEnd){const d=(t-T.walk0)*T.walkSpeed,n=Math.floor(d/20);if(n!==this.steps){this.steps=n;nburst(210,1,.07,.16,'lowpass')}}
    // sfogliare
    if(t>T.sitEnd&&t<T.readEnd){const n=Math.floor((t-T.sitEnd)/1.7);if(n!==this.pg){this.pg=n;nburst(5200,2,.12,.07,'highpass')}}
    // addormentarsi: la musica della stanza sfuma, il cuore comincia a battere, poi entra la colonna sonora del sogno
    if(t>T.sleepEnd-1.6&&MU.name==='mystery'){musicStop(2.5);setFire(0)}
    if(t>T.sleepEnd-.2&&MU.name!=='sogno')musicStart('sogno',5);
    this.heart(t);
    if(t>T.dream0){
      const v=Math.floor((t-T.dream0)/(T.vis+T.gap));if(v!==this.vis&&v<4){this.vis=v}}
    if(t>=T.end&&!this.done){this.done=true;S.dreamSeen=true;save();musicStop(2.5);setRain(0,true);setFire(0)}
    if(this.done)setHint('FINE DEL PRIMO CAPITOLO',true)},
  down(){if(this.done&&this.t>SOGNO_T.end+2.5)location.reload()},
  /* battito di cuore: due colpi sordi (lub-dub) che accelerano e si fanno piu' forti con il sonno */
  heart(t){const T=SOGNO_T;if(!AU.ctx||t<T.readEnd+2.5||t>T.end-.8)return;
    const c=AU.ctx;if(this.nb===undefined||this.nb<c.currentTime-1)this.nb=c.currentTime+.05;
    while(this.nb<c.currentTime+.4){const k=clamp((t-T.readEnd-2.5)/(T.end-T.readEnd-3),0,1),vol=.18+.5*sm(k*1.6),per=lerp(1.15,.78,k),tb=this.nb;
      for(const [dt,f0,f1,vv] of [[0,70,42,1],[.27,60,36,.62]]){const o=c.createOscillator(),gn=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;
        o.type='sine';o.frequency.setValueAtTime(f0,tb+dt);o.frequency.exponentialRampToValueAtTime(f1,tb+dt+.13);
        gn.gain.setValueAtTime(0,tb+dt);gn.gain.linearRampToValueAtTime(vol*vv,tb+dt+.012);gn.gain.exponentialRampToValueAtTime(.001,tb+dt+.26);
        o.connect(lp);lp.connect(gn);gn.connect(AU.master);o.start(tb+dt);o.stop(tb+dt+.3)}
      this.nb+=per}},
  draw(){
    const t=this.t,T=SOGNO_T;
    if(t<T.dream0)this.drawRoom(t);else{R(0,0,W,H,'#000')}
    if(t>=T.dream0-.5)this.drawDream(t-T.dream0);
    // dissolvenza in nero verso il sogno
    if(t>T.sleepEnd&&t<T.dream0){g.globalAlpha=clamp((t-T.sleepEnd)/1.8,0,1);R(0,0,W,H,'#000');g.globalAlpha=1}
    if(t>=T.end-.6){g.globalAlpha=clamp((t-(T.end-.6))/.6,0,1);R(0,0,W,H,'#000');g.globalAlpha=1}},
  drawRoom(t){
    const T=SOGNO_T;inside.draw();
    const sx=210,legalpha=clamp((t-T.walkEnd)/.5,0,1);
    const wk=t>T.walk0&&t<T.walkEnd,u=clamp((t-T.walk0)/(T.walkEnd-T.walk0),0,1);
    const RM=.1,Du=u<RM?u*u/(2*RM):u<1-RM?RM/2+(u-RM):(1-RM)-(1-u)*(1-u)/(2*RM);   // parte e si ferma gradualmente
    const x=T.x0+(T.x1-T.x0)*Du/(1-RM);
    const d=x-T.x0,ph=d/5,pi=Math.floor(ph),fB=sm(clamp((ph-pi-.6)/.4,0,1));   // 5 px per fotogramma: il piede resta fermo a terra mentre il corpo avanza
    const f=wk?pi%8:0,f2=wk?(pi+1)%8:0;           // 8 pose in sequenza: contatto, discesa, passaggio, salita, poi l'altra gamba
    const bob=0;
    const seated=t>=T.walkEnd;
    if(!seated||legalpha<1){
      const a=seated?1-legalpha:Math.min(1,t/.8);
      g.globalAlpha=.6*a;ell(x-2,T.fy+1,12,3,'#05060a');g.globalAlpha=1;
      figureLit(c=>{c.globalAlpha=a;const FW=28,FH=56,CX=15,W8=IMG_WALK8.complete&&IMG_WALK8.naturalWidth,IM=W8?IMG_WALK8:IMG_PINT,fw=W8?28:26,ff=W8?f:[2,3,1,6,7,5][f%6]||0,ff2=W8?f2:[2,3,1,6,7,5][f2%6]||0;
        const by=Math.round(T.fy-FH+bob+1),bx=Math.round(x-CX);
        c.drawImage(IM,ff*fw,0,fw,FH,bx,by,fw,FH);
        if(wk&&fB>.02){c.globalAlpha=a*fB;c.drawImage(IM,ff2*fw,0,fw,FH,bx,by,fw,FH);c.globalAlpha=a}
        // il libro chiuso, tenuto davanti al busto con la mano
        const bk=sprTex('book_locked_small'),bw=Math.round(bk.width*.7),bh=Math.round(bk.height*.7);
        c.drawImage(bk,bx+17,by+27,bw,bh);
        c.fillStyle='#b88a68';c.fillRect(bx+17,by+30,2,3);c.fillRect(bx+17+bw-2,by+27+bh-3,2,3);c.globalAlpha=1})}
    if(seated){
      let ang=0,dy=0,arm=-2.15,bookMode=0;
      if(t<T.readEnd){ang=.07+Math.sin(t*.9)*.02;dy=.3*Math.sin(t*1.6);arm=-2.15+.04*Math.sin(t*1.3)}
      else{const k=sm((t-T.readEnd-.6)/3.4),k2=sm((t-T.readEnd-1.6)/2.6);ang=.07+.42*k;dy=2.2*k;arm=lerp(-2.15,-1.35,k2);bookMode=k2}
      const flip=(t<T.readEnd)&&((t-T.sitEnd)%1.9<.2);
      figureLit(c=>{c.globalAlpha=legalpha;
        if(IMG_SEAT.complete&&IMG_SEAT.naturalWidth){
          const fi=t<T.readEnd?(flip?1:0):2,ax=172,ay=108-54+Math.round(dy*.5);
          c.save();c.translate(ax,0);c.scale(-1,1);c.drawImage(IMG_SEAT,fi*40,0,40,54,-39,ay,40,54);c.restore()}
        else drawSeat(c,{x:sx,y:89,ang,dy,arm,bookMode,flip});
        c.globalAlpha=1});
      if(t>T.readEnd+3){const zt=t-T.readEnd-3;for(let i=0;i<3;i++){const uu=((zt*.5+i/3)%1),a=Math.sin(uu*Math.PI);g.globalAlpha=a*.8;txt('Z',sx-16-uu*7-i*1.5,54-uu*18,'#d8cfb0',1);g.globalAlpha=1}}
    }},
  drawWoman(wt){
    const im=IMG_WOMAN;if(!(im.complete&&im.naturalWidth))return;
    const T=SOGNO_T,IW=im.naturalWidth,IH=im.naturalHeight,hold=2.6,dur=T.wom-hold;
    const k=clamp((wt-hold)/dur,0,1),e=k*k*(3-2*k);
    const z=Math.pow(70,e),rw=IW/z,rh=rw*H/W;                      // da tutta l'immagine fino a stare dentro la pupilla
    const px=IW*338/728,py=IH*122/364,cx=lerp(IW/2,px,Math.pow(e,.8)),cy=lerp(IH*.46,py,Math.pow(e,.8));
    const fin=clamp(wt/1.4,0,1),mic=wt<hold?0:Math.sin(wt*38)*.35*e;      // piccolo tremito mentre si stringe
    g.globalAlpha=fin;g.imageSmoothingEnabled=z<3;
    g.drawImage(im,clamp(cx-rw/2+mic,0,IW-rw),clamp(cy-rh/2,0,IH-rh),rw,rh,0,0,W,H);
    g.imageSmoothingEnabled=false;
    g.globalAlpha=.16*fin;R(0,0,W,H,'#2a3a6a');                    // velo freddo
    g.globalAlpha=.3*fin;for(let n=0;n<110;n++)R(Math.random()*W,Math.random()*H,1,1,Math.random()<.5?'#000':'#9aa0c0');   // grana
    g.globalAlpha=1},
  drawDream(dt){
    const T=SOGNO_T,per=T.vis+T.gap,i=Math.floor(dt/per);if(dt>=4*per){this.drawWoman(dt-4*per);return}if(i<0||i>3)return;
    const age=dt-i*per;if(age>T.vis)return;
    const env=clamp(Math.min(age/1.3,(T.vis-age)/1.3),0,1),img=IMG_DREAM[i];
    if(!img.complete||!img.naturalWidth)return;
    // immagine con zoom lento, rotazione e deriva (instabile come un ricordo)
    const z=1.02+.05*age/T.vis,rot=Math.sin(age*1.3+i)*.014,cx=120+Math.sin(age*.9+i*2)*3,cy=60+Math.cos(age*1.1+i)*2;
    dx.setTransform(1,0,0,1,0,0);dx.clearRect(0,0,W,H);dx.globalAlpha=1;
    dx.save();dx.translate(cx,cy);dx.rotate(rot);dx.scale(z,z);dx.translate(-120,-60);dx.drawImage(img,0,0);
    dx.globalAlpha=.32;dx.translate(120,60);dx.scale(1.025,1.025);dx.translate(-120+2.2*Math.sin(age*2.1),-60);dx.drawImage(img,0,0);dx.restore();
    // onda orizzontale: l'immagine "respira"
    g.globalAlpha=env;
    const amp=1.5+1.1*Math.sin(age*.8);
    for(let y=0;y<H;y+=2){const o=Math.round(Math.sin(y*.13+age*2.6)*amp);g.drawImage(dc,0,y,W,2,o,y,W,2)}
    // velo freddo/viola e lampi di luminosita'
    g.globalAlpha=env*.2;R(0,0,W,H,'#3a2a6a');
    g.globalAlpha=env*Math.max(0,.07*Math.sin(age*7.3)*Math.sin(age*1.7));R(0,0,W,H,'#d8e0ff');
    // grana
    g.globalAlpha=env*.35;for(let k=0;k<140;k++)R(Math.random()*W,Math.random()*H,1,1,Math.random()<.5?'#000':'#9aa0c0');
    // vignettatura nera circolare, che pulsa
    const rr=66+3*Math.sin(age*1.6)+1.2*Math.sin(age*5.1);
    g.save();g.translate(120+Math.sin(age*.7)*1.5,60);g.scale(1.95,1);
    const gr=g.createRadialGradient(0,0,rr*.5,0,0,rr);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.72,'rgba(0,0,0,.5)');gr.addColorStop(1,'rgba(0,0,0,1)');
    g.globalAlpha=1;g.fillStyle=gr;g.fillRect(-130,-62,260,124);
    g.beginPath();g.rect(-130,-62,260,124);g.arc(0,0,rr,0,Math.PI*2,true);g.clip('evenodd');g.fillStyle='#000';g.fillRect(-130,-62,260,124);g.restore();
    // dissolvenza di ingresso/uscita attraverso il nero
    g.globalAlpha=1-env;R(0,0,W,H,'#000');g.globalAlpha=1}
};
